; Astrochronist Calendar for the ESP32-2432S028R "Cheap Yellow Display" (320x240, ILI9341/ST7789 + XPT2046)
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags = -O2
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
