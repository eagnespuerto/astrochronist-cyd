; Astrochronist Calendar for the ESP32-2432S028R "Cheap Yellow Display" (320x240, ILI9341/ST7789 + XPT2046)
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags = -O2
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; Same firmware with the panel colour inversion flipped, for boards (like the tested ST7789 one)
; where the default build shows inverted colours. Build with: pio run -e cyd-uninverted
[env:cyd-uninverted]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DFLIP_COLOURS=1
